<div class="profile-container">
  <!-- Navigation -->
  <mat-toolbar class="navbar">
    <div class="nav-content">
      <div class="logo" routerLink="/">
        <mat-icon>group</mat-icon>
        <span class="logo-text">Social Circle</span>
      </div>
      <div class="nav-actions">
        <button mat-button routerLink="/activities">Browse Activities</button>
        <button mat-button routerLink="/create-activity">Create Activity</button>
      </div>
    </div>
  </mat-toolbar>

  <div class="main-content">
    <div class="profile-content">
      <mat-card class="profile-card">
        <mat-card-header>
          <mat-card-title>My Profile</mat-card-title>
          <mat-card-subtitle>Manage your account information</mat-card-subtitle>
        </mat-card-header>

        <mat-card-content>
          <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
            <div class="form-section">
              <h3>Basic Information</h3>
              
              <div class="form-row two-columns">
                <mat-form-field appearance="outline">
                  <mat-label>First Name</mat-label>
                  <input matInput formControlName="firstName">
                  <mat-error *ngIf="profileForm.get('firstName')?.hasError('required')">
                    First name is required
                  </mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline">
                  <mat-label>Last Name</mat-label>
                  <input matInput formControlName="lastName">
                  <mat-error *ngIf="profileForm.get('lastName')?.hasError('required')">
                    Last name is required
                  </mat-error>
                </mat-form-field>
              </div>

              <div class="form-row">
                <mat-form-field appearance="outline" class="full-width">
                  <mat-label>Email</mat-label>
                  <input matInput formControlName="email" readonly>
                </mat-form-field>
              </div>

              <div class="form-row two-columns">
                <mat-form-field appearance="outline">
                  <mat-label>Age</mat-label>
                  <input matInput type="number" formControlName="age" min="18" max="100">
                </mat-form-field>

                <mat-form-field appearance="outline">
                  <mat-label>Location</mat-label>
                  <input matInput formControlName="location" placeholder="City, State">
                </mat-form-field>
              </div>

              <div class="form-row">
                <mat-form-field appearance="outline" class="full-width">
                  <mat-label>Bio</mat-label>
                  <textarea matInput formControlName="bio" rows="4" 
                           placeholder="Tell others about yourself..."></textarea>
                </mat-form-field>
              </div>
            </div>

            <div class="form-section">
              <h3>Interests</h3>
              <p class="section-description">Select your interests to help others find you for activities</p>
              
              <div class="interests-grid">
                <mat-checkbox *ngFor="let interest of availableInterests" 
                             [checked]="selectedInterests.includes(interest)"
                             (change)="toggleInterest(interest)">
                  {{ interest }}
                </mat-checkbox>
              </div>
            </div>

            <div class="form-actions">
              <button mat-raised-button color="primary" type="submit" 
                     [disabled]="profileForm.invalid || loading" class="save-button">
                <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
                <span *ngIf="!loading">Save Changes</span>
              </button>
            </div>
          </form>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
